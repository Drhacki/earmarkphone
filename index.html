<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141E23" media="(prefers-color-scheme: dark)">
<title>Earmark</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Earmark</a>
  <nav aria-label="Main">
    <a href="#/" data-nav="library"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5m0-15v15m0 0A1.5 1.5 0 0 0 6.5 21H19"/></svg><span>Library</span></a>
    <a href="#/review" data-nav="review"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Review</span> <span class="badge" id="badge-due" hidden></span></a>
    <a href="#/weak" data-nav="weak"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/></svg><span>Weak spots</span> <span class="badge" id="badge-clips" hidden></span></a>
    <a href="#/progress" data-nav="progress"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10M3 20.5h18"/></svg><span>Progress</span></a>
    <a href="#/settings" data-nav="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Settings</span></a>
  </nav>
</header>
<main id="view" tabindex="-1"><p class="muted">Opening Earmark…</p></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
<script>
  // Keeps a copy of the app on the phone, so it opens without internet.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
